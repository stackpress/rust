[package]
name = "stackpress-sql-postgres"
description = "Bounded native PostgreSQL adapter for Stackpress SQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
stackpress-sql = { path = "../sql" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "m0"
harness = false

[lints]
workspace = true
