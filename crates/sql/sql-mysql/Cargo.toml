[package]
name = "stackpress-sql-mysql"
description = "Bounded native MySQL adapter for Stackpress SQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
stackpress-sql = { path = "../sql" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls-ring", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
generated-workspace-app = { path = "../../../examples/generated-workspace/app" }
stackpress-framework-schema = { path = "../../framework/framework-schema" }
stackpress-framework-sql = { path = "../../framework/framework-sql" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "m0"
harness = false

[lints]
workspace = true

[[test]]
name = "m1"
path = "src/m1.rs"
harness = false

[[test]]
name = "m2"
path = "src/m2.rs"
harness = false
