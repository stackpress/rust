[package]
name = "stackpress-sql-mysql"
description = "Bounded native MySQL adapter for Stackpress SQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database"]
license.workspace = true
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[dependencies]
stackpress-sql = { path = "../sql", version = "0.2.0" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls-ring", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
stackpress-framework-schema = { path = "../../framework/framework-schema" }
stackpress-framework-sql = { path = "../../framework/framework-sql" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "m0"
harness = false

[lints]
workspace = true

[[test]]
name = "m1"
path = "src/m1.rs"
harness = false

[[test]]
name = "m2"
path = "src/m2.rs"
harness = false
