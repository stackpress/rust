[package]
name = "stackpress-sql-sqlite"
description = "Bounded native SQLite adapter for Stackpress SQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database"]
license.workspace = true
# Provisional: the tests lane moves server-dependent host/trybuild proofs to repo tooling.
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE", "/*.md", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[features]
default = []
maintenance = []

[dependencies]
stackpress-sql = { path = "../sql", version = "0.2.0" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tempfile = "3"
trybuild = "1"
serde_json = "1"
stackpress-lib = { path = "../../lib", version = "0.2.0" }

[lints]
workspace = true
