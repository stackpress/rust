[package]
name = "stackpress-idea"
description = "Independent Idea generation orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["parsing"]
license.workspace = true
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[dependencies]
stackpress-idea-parser = { path = "../idea-parser", version = "0.2.1" }
stackpress-idea-transformer = { path = "../idea-transformer", version = "0.2.1" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
