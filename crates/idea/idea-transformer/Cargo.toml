[package]
name = "stackpress-idea-transformer"
description = "Ordered Idea transforms and cooperatively owned generated output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["parsing"]
license.workspace = true
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[dependencies]
stackpress-idea-parser = { path = "../idea-parser", version = "0.2.1" }
stackpress-lib = { path = "../../lib", version = "0.2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[lints]
workspace = true
