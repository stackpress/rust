[package]
name = "stackpress-framework-view"
description = "Client-safe public page snapshots and bounded HTML contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
server = ["dep:stackpress-lib", "dep:stackpress-server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stackpress-lib = { path = "../../lib", optional = true }
stackpress-server = { path = "../../server/server", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
