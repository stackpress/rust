[package]
name = "stackpress-framework-preferences"
description = "Host-authoritative presentation preferences, public flash and fail-closed action projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
native-file = ["dep:libc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackpress-framework-language = { path = "../framework-language" }
stackpress-framework-view = { path = "../framework-view" }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

[lints]
workspace = true
