[package]
name = "stackpress-framework-api"
description = "Source-compatible API configuration and invocation mechanics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["web-programming"]
license-file = "LICENSE"
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[features]
default = []
native = ["dep:stackpress-framework-session", "stackpress-framework-schema/providers"]
sql = ["stackpress-framework-sql/source", "stackpress-framework-sql/server", "native", "stackpress-framework-session/sql", "dep:stackpress-framework-sql", "dep:stackpress-sql"]
codegen = ["dep:stackpress-idea-transformer", "native", "stackpress-framework-schema/codegen", "dep:stackpress-idea-parser", "dep:stackpress-framework-admin", "stackpress-framework-admin/codegen", "stackpress-framework-admin/format"]
ui = ["stackpress-framework-admin/source", "dep:leptos", "dep:stackpress-leptos", "dep:stackpress-framework-admin", "stackpress-framework-admin/format", "dep:stackpress-framework-view"]
ui-ssr = ["stackpress-framework-admin/source-ssr", "ui", "dep:chrono", "dep:stackpress-framework-csrf", "leptos/ssr", "stackpress-leptos/ssr", "stackpress-framework-admin/ssr", "dep:stackpress-framework-view"]
ui-hydrate = ["ui", "leptos/hydrate", "stackpress-leptos/hydrate", "stackpress-framework-admin/hydrate"]
ui-csr = ["ui", "leptos/csr", "stackpress-leptos/csr", "stackpress-framework-admin/csr"]

[dependencies]
stackpress-lib = { path = "../../lib", version = "0.2.0" }

stackpress-framework-schema = { path = "../framework-schema", version = "0.2.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
leptos = { version = "=0.8.22", default-features = false, optional = true }
stackpress-leptos = { path = "../../leptos", version = "0.2.0", features = ["format"], optional = true }
stackpress-framework-admin = { path = "../framework-admin", version = "0.2.0", optional = true }
stackpress-framework-view = { path = "../framework-view", version = "0.2.0", features = ["preferences"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stackpress-idea-transformer = { path = "../../idea/idea-transformer", version = "0.2.0", optional = true }
stackpress-server = { path = "../../server/server", version = "0.2.0" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"], optional = true }
stackpress-framework-csrf = { path = "../framework-csrf", version = "0.2.0", optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
stackpress-framework-session = { path = "../framework-session", version = "0.2.0", features = ["native"], optional = true }
stackpress-framework-sql = { path = "../framework-sql", version = "0.2.0", optional = true }
stackpress-sql = { path = "../../sql/sql", version = "0.2.0", optional = true }
stackpress-idea-parser = { path = "../../idea/idea-parser", version = "0.2.0", optional = true }

[dev-dependencies]
stackpress-framework-schema = { path = "../framework-schema", version = "0.2.0", features = ["codegen", "providers"] }
stackpress-idea-transformer = { path = "../../idea/idea-transformer", version = "0.2.0" }
stackpress-framework-sql = { path = "../framework-sql", version = "0.2.0", features = ["codegen", "server", "source"] }
stackpress-framework-session = { path = "../framework-session", version = "0.2.0", features = ["server"] }
stackpress-sql-sqlite = { path = "../../sql/sql-sqlite", version = "0.2.0" }
stackpress-sql-postgres = { path = "../../sql/sql-postgres", version = "0.2.0" }
stackpress-sql-mysql = { path = "../../sql/sql-mysql", version = "0.2.0" }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

[[test]]
name = "live_search"
path = "tests/live_search.rs"
harness = false
required-features = ["sql"]

[[example]]
name = "regenerate_api_models"
path = "tests/fixtures/regenerate.rs"
