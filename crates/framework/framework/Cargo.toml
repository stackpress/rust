[package]
name = "stackpress-framework"
description = "Compile-time composition of the source Stackpress framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["web-programming"]
license-file = "LICENSE"
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[features]
default = []
native = ["dep:stackpress-lib", "dep:stackpress-server", "dep:stackpress-framework-schema", "dep:serde", "dep:serde_json"]
server-commands = ["native"]
schema-client = ["native"]
language = ["native"]
csrf = ["native", "dep:stackpress-framework-csrf", "stackpress-framework-csrf/server"]
sql = ["native", "dep:stackpress-sql", "dep:stackpress-framework-sql"]
view = ["native", "dep:stackpress-framework-view", "dep:tokio"]
codegen = ["schema-client", "dep:stackpress-idea", "dep:stackpress-framework-sql", "dep:stackpress-framework-session", "dep:stackpress-framework-api", "dep:stackpress-framework-admin", "stackpress-framework-admin/codegen", "stackpress-framework-admin/format", "stackpress-framework-schema/codegen", "stackpress-framework-sql/codegen"]
session = ["native", "dep:stackpress-framework-session", "stackpress-framework-session/auth-server"]
api = ["native", "dep:stackpress-framework-api", "stackpress-framework-api/sql"]
admin = ["native"]
full = ["server-commands", "schema-client", "language", "csrf", "sql", "view", "session", "api", "admin"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stackpress-lib = { path = "../../lib", version = "0.2.1", default-features = false, optional = true }
stackpress-server = { path = "../../server/server", version = "0.2.1", default-features = false, optional = true }
stackpress-framework-schema = { path = "../framework-schema", version = "0.2.1", default-features = false, optional = true }
stackpress-framework-csrf = { path = "../framework-csrf", version = "0.2.1", default-features = false, optional = true }
stackpress-framework-session = { path = "../framework-session", version = "0.2.1", default-features = false, optional = true }
stackpress-framework-api = { path = "../framework-api", version = "0.2.1", default-features = false, optional = true }
stackpress-sql = { path = "../../sql/sql", version = "0.2.1", default-features = false, optional = true }
stackpress-framework-view = { path = "../framework-view", version = "0.2.1", default-features = false, optional = true }
stackpress-framework-sql = { path = "../framework-sql", version = "0.2.1", default-features = false, optional = true }
stackpress-idea = { path = "../../idea/idea", version = "0.2.1", default-features = false, optional = true }
stackpress-framework-admin = { path = "../framework-admin", version = "0.2.1", default-features = false, optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", features = ["preserve_order"], optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync"], optional = true }

[dev-dependencies]
stackpress-idea-transformer = { path = "../../idea/idea-transformer", version = "0.2.1" }
stackpress-framework-schema = { path = "../framework-schema", version = "0.2.1", features = ["codegen", "providers"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
trybuild = "1"
stackpress-sql-sqlite = { path = "../../sql/sql-sqlite", version = "0.2.1", default-features = false }
stackpress-sql-postgres = { path = "../../sql/sql-postgres", version = "0.2.1", default-features = false }
stackpress-sql-mysql = { path = "../../sql/sql-mysql", version = "0.2.1", default-features = false }
stackpress-framework-sql = { path = "../framework-sql", version = "0.2.1", default-features = false, features = ["migrations", "codegen", "server"] }

[[test]]
name = "live_setup"
path = "tests/live_setup.rs"
harness = false
required-features = ["full"]

[lints]
workspace = true

[[example]]
name = "regenerate_aggregate_models"
path = "tests/fixtures/regenerate.rs"
required-features = ["codegen", "full"]
