[package]
name = "stackpress-framework-admin"
description = "Public generated UI role adapters and optional deterministic code generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["web-programming"]
license-file = "LICENSE"
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[features]
default = []
source = ["dep:stackpress-lib", "stackpress-leptos/source"]
source-ssr = ["source", "ssr", "dep:chrono"]
format = ["stackpress-leptos/format"]
ssr = ["stackpress-leptos/ssr"]
hydrate = ["stackpress-leptos/hydrate"]
csr = ["stackpress-leptos/csr"]
codegen = ["stackpress-framework-schema/codegen", "dep:stackpress-idea-transformer", "dep:stackpress-lib"]

[dependencies]
stackpress-lib = { path = "../../lib", version = "0.2.0", optional = true }
stackpress-framework-schema = { path = "../framework-schema", version = "0.2.0" }
stackpress-leptos = { path = "../../leptos", version = "0.2.0" }
stackpress-idea-transformer = { path = "../../idea/idea-transformer", version = "0.2.0", optional = true }
leptos = { version = "=0.8.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"], optional = true }

[dev-dependencies]
tempfile = "3"
stackpress-idea-parser = { path = "../../idea/idea-parser", version = "0.2.0" }

[lints]
workspace = true
