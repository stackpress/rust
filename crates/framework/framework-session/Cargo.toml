[package]
name = "stackpress-framework-session"
description = "Source-parity JWT identity and configured permission mechanisms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:stackpress-lib", "dep:base64", "dep:jsonwebtoken", "dep:stackpress-framework-schema", "dep:time"]
sql = ["native", "dep:stackpress-sql", "dep:stackpress-framework-sql"]
server = ["native", "dep:stackpress-lib", "dep:stackpress-server"]
leptos = ["dep:leptos", "dep:leptos_meta", "dep:stackpress-leptos", "dep:stackpress-framework-view", "dep:phonenumber"]
leptos-ssr = ["leptos", "auth-server", "stackpress-leptos/ssr", "stackpress-framework-view/leptos-ssr"]
browser = ["dep:web-sys", "dep:wasm-bindgen-futures"]
leptos-hydrate = ["leptos", "browser", "stackpress-leptos/hydrate"]
leptos-csr = ["leptos", "browser", "stackpress-leptos/csr"]
auth-server = ["server", "sql", "dep:stackpress-framework-csrf", "dep:stackpress-framework-email", "stackpress-framework-email/server", "dep:tokio", "dep:ring", "dep:qrcode", "dep:png"]

[dependencies]
leptos = { version = "=0.8.22", default-features = false, optional = true }
leptos_meta = { version = "=0.8.7", default-features = false, optional = true }
stackpress-leptos = { path = "../../leptos", default-features = false, optional = true }
stackpress-framework-view = { path = "../framework-view", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "=1.13.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.106", default-features = false, optional = true, features = ["Window", "Document", "Element", "Navigator", "Clipboard"] }
wasm-bindgen-futures = { version = "=0.4.79", default-features = false, optional = true }
phonenumber = { version = "=0.3.10", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SSR and browser need identical initial phone formatting; native identity alone stays unchanged.
phonenumber = { version = "=0.3.10", default-features = false, optional = true }
stackpress-framework-schema = { path = "../framework-schema", features = ["providers"], optional = true }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"], optional = true }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"], optional = true }
time = { version = "=0.3.55", default-features = false, features = ["formatting", "parsing"], optional = true }
stackpress-sql = { path = "../../sql/sql", optional = true }
stackpress-framework-sql = { path = "../framework-sql", optional = true }
stackpress-lib = { path = "../../lib", optional = true }
stackpress-server = { path = "../../server/server", optional = true }
stackpress-framework-csrf = { path = "../framework-csrf", optional = true }
stackpress-framework-email = { path = "../framework-email", optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
qrcode = { version = "=0.14.1", default-features = false, optional = true }
png = { version = "=0.18.1", default-features = false, optional = true }
ring = { version = "=0.17.14", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
stackpress-framework-email = { path = "../framework-email", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
stackpress-framework-schema = { path = "../framework-schema", features = ["providers"] }
stackpress-sql = { path = "../../sql/sql" }
stackpress-sql-sqlite = { path = "../../sql/sql-sqlite" }
stackpress-sql-postgres = { path = "../../sql/sql-postgres" }
stackpress-sql-mysql = { path = "../../sql/sql-mysql" }
trybuild = "1"
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "live_search"
path = "tests/live_search.rs"
harness = false
required-features = ["sql"]

[[example]]
name = "account_host"
required-features = ["leptos-ssr"]
