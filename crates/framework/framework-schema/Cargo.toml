[package]
name = "stackpress-framework-schema"
description = "Owned framework schema contracts and explicit build-host normalization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
providers = ["dep:sha3", "dep:ring", "dep:aes", "dep:cbc", "dep:base64"]
codegen = ["dep:stackpress-idea-parser", "dep:stackpress-idea-transformer", "dep:sha2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
url = "2.5.8"
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting"] }
stackpress-idea-parser = { path = "../../idea/idea-parser", optional = true }
stackpress-idea-transformer = { path = "../../idea/idea-transformer", optional = true }
sha2 = { version = "0.10.9", optional = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha3 = { version = "=0.10.8", default-features = false, optional = true }
ring = { version = "=0.17.14", default-features = false, optional = true }
aes = { version = "=0.8.4", default-features = false, optional = true }
cbc = { version = "=0.1.2", default-features = false, features = ["alloc", "block-padding"], optional = true }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"], optional = true }
