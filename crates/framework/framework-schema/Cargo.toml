[package]
name = "stackpress-framework-schema"
description = "Owned framework schema contracts and explicit build-host normalization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
codegen = ["dep:stackpress-idea-parser", "dep:stackpress-idea-transformer", "dep:sha2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackpress-idea-parser = { path = "../../idea/idea-parser", optional = true }
stackpress-idea-transformer = { path = "../../idea/idea-transformer", optional = true }
sha2 = { version = "0.10.9", optional = true }

[lints]
workspace = true
