[package]
name = "stackpress-framework-models"
description = "Generated default source schemas for the Stackpress framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
server = ["stackpress-framework-sql/server"]
generate = ["stackpress-framework-sql/codegen", "stackpress-framework-schema/codegen", "dep:stackpress-idea-parser", "dep:stackpress-idea-transformer"]

[dependencies]
stackpress-framework-sql = { path = "../framework-sql", features = ["source"] }
stackpress-framework-schema = { path = "../framework-schema", features = ["source"] }
stackpress-idea-parser = { path = "../../idea/idea-parser", optional = true }
stackpress-idea-transformer = { path = "../../idea/idea-transformer", optional = true }

[dev-dependencies]
stackpress-sql = { path = "../../sql/sql" }
stackpress-sql-sqlite = { path = "../../sql/sql-sqlite" }
stackpress-sql-mysql = { path = "../../sql/sql-mysql" }
stackpress-sql-postgres = { path = "../../sql/sql-postgres" }
stackpress-lib = { path = "../../lib" }
stackpress-server = { path = "../../server/server" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tempfile = "3"
serde_json = "1"

[[bin]]
name = "framework-models-generate"
path = "src/bin/generate.rs"
required-features = ["generate"]

[lints]
workspace = true

[[test]]
name = "live_search"
path = "tests/live_search.rs"
harness = false
