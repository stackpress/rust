[package]
name = "stackpress-framework-ui"
description = "Explicit Leptos render modes over public page contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:futures", "dep:any_spawner", "dep:tokio", "stackpress-framework-view/server"]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]

[dependencies]
stackpress-framework-view = { path = "../framework-view" }
leptos = { version = "=0.8.22", default-features = false }
leptos_meta = { version = "=0.8.7", default-features = false }
leptos_router = { version = "=0.8.17", default-features = false }
futures = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
any_spawner = { version = "=0.3.0", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
