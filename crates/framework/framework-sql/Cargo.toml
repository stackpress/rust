[package]
name = "stackpress-framework-sql"
description = "Borrowed generated stores and explicit SQLite migration planning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database"]
license-file = "LICENSE"
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[features]
default = []
source = ["stackpress-framework-schema/source"]
server = ["dep:stackpress-lib", "dep:stackpress-server"]
codegen = ["stackpress-framework-schema/codegen", "dep:stackpress-idea-transformer", "dep:stackpress-lib"]
migrations = ["dep:sha2"]
sqlite-maintenance = ["migrations", "dep:stackpress-sql-sqlite", "dep:tokio"]

[dependencies]
stackpress-framework-schema = { path = "../framework-schema", version = "0.2.0" }
stackpress-sql = { path = "../../sql/sql", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackpress-lib = { path = "../../lib", version = "0.2.0", optional = true }
stackpress-server = { path = "../../server/server", version = "0.2.0", optional = true }
stackpress-idea-transformer = { path = "../../idea/idea-transformer", version = "0.2.0", optional = true }
stackpress-sql-sqlite = { path = "../../sql/sql-sqlite", version = "0.2.0", features = ["maintenance"], optional = true }
sha2 = { version = "0.10.9", optional = true }

tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tempfile = "3"
trybuild = "1"

[lints]
workspace = true
