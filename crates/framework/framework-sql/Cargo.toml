[package]
name = "stackpress-framework-sql"
description = "Borrowed generated stores and explicit SQLite migration planning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
server = ["dep:stackpress-lib", "dep:stackpress-server"]
codegen = ["stackpress-framework-schema/codegen", "dep:stackpress-idea-transformer"]
migrations = ["dep:sha2"]
sqlite-maintenance = ["migrations", "dep:stackpress-sql-sqlite", "dep:tokio"]

[dependencies]
stackpress-framework-schema = { path = "../framework-schema" }
stackpress-sql = { path = "../../sql/sql" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackpress-lib = { path = "../../lib", optional = true }
stackpress-server = { path = "../../server/server", optional = true }
stackpress-idea-transformer = { path = "../../idea/idea-transformer", optional = true }
stackpress-sql-sqlite = { path = "../../sql/sql-sqlite", features = ["maintenance"], optional = true }
sha2 = { version = "0.10.9", optional = true }

tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tempfile = "3"
trybuild = "1"

[lints]
workspace = true
