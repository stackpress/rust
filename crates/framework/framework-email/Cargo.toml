[package]
name = "stackpress-framework-email"
description = "Per-call Send email transport contracts and supervised background hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["web-programming"]
license-file = "LICENSE"
# Provisional: integration/generation roots need later-order development crates.
# Keep TLS assets embedded by the library's unit tests.
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/fixtures/tls-*.pem", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[features]
default = []
server = ["dep:stackpress-lib", "dep:stackpress-server"]

[dependencies]
stackpress-lib = { path = "../../lib", version = "0.1.0", optional = true }
stackpress-server = { path = "../../server/server", version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-util", "process", "macros"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
url = "=2.5.8"
base64 = "=0.22.1"
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "gzip", "deflate", "cookies"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
