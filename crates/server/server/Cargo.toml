[package]
name = "stackpress-server"
description = "Transport-neutral Stackpress capability host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["asynchronous", "network-programming"]
license.workspace = true
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[features]
default = []
http = ["dep:http"]
http-stream = ["http", "dep:futures-core"]
http-sse = ["http-stream"]
http-upgrade = ["http-stream"]

[dependencies]
stackpress-lib = { path = "../../lib", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
http = { version = "1", optional = true }

futures-core = { version = "=0.3.34", optional = true }

[dev-dependencies]
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
