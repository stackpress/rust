[package]
name = "stackpress-server-http"
description = "Owned HTTP/1 IO hosting for Stackpress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["asynchronous", "network-programming"]
license.workspace = true
include = ["/src/**", "/README.md", "/LICENSE", "/*.md", "/tests/**", "/examples/**", "/docs/**/*.md", "/third-party/**", "/data/**", "/*.idea"]

[features]
default = []
tls = ["dep:rustls", "dep:tokio-rustls"]
sse = ["stackpress-server/http-sse"]
websocket = ["stackpress-server/http-upgrade", "dep:tokio-tungstenite", "dep:tungstenite", "dep:futures-util", "dep:base64"]

[dependencies]
stackpress-lib = { path = "../../lib", version = "0.2.0" }
stackpress-server = { path = "../server", version = "0.2.0", features = ["http-stream"] }
hyper = { version = "=1.10.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.4"
bytes = "=1.12.1"
futures-core = "=0.3.34"
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", optional = true, default-features = false, features = ["ring", "tls12"] }

tokio-tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = ["handshake"] }
tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["sink", "std"] }
base64 = { version = "=0.22.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "realtime"
required-features = ["sse", "websocket"]
