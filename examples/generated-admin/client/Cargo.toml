[package]
name = "generated-admin-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = []
hydrate = ["generated-admin-shared/hydrate"]
csr = ["generated-admin-shared/csr"]

[dependencies]
generated-admin-shared = { path = "../shared" }
leptos = { version = "=0.8.22", default-features = false }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }

[lints]
workspace = true
