[package]
name = "generated-admin-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true


[features]
default = []
format = ["stackpress-framework-admin/format"]

[dependencies]
stackpress-framework-admin = { path = "../../../crates/framework/framework-admin", features = ["codegen"] }
stackpress-framework-schema = { path = "../../../crates/framework/framework-schema", features = ["codegen"] }
stackpress-framework-sql = { path = "../../../crates/framework/framework-sql", features = ["codegen"] }
