[package]
name = "blog-client"
description = "Separately compiled hydration and CSR browser entries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = ["blog-shared/hydrate", "leptos/hydrate"]
csr = ["blog-shared/csr", "leptos/csr"]

[dependencies]
blog-shared = { path = "../shared" }
leptos.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlFormElement", "Node", "Response", "AbortController", "AbortSignal", "RequestInit", "Location"] }

[lints]
workspace = true
