[workspace]
resolver = "3"

[package]
name = "leptos-independent"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = ["leptos/ssr", "stackpress-leptos/ssr"]
hydrate = ["leptos/hydrate", "stackpress-leptos/hydrate"]
csr = ["leptos/csr", "stackpress-leptos/csr"]
async = ["stackpress-leptos/async"]
rich = ["stackpress-leptos/rich"]
format = ["stackpress-leptos/format"]
stream = ["ssr", "stackpress-leptos/stream"]

[dependencies]
leptos = { version = "=0.8.22", default-features = false }
stackpress-leptos = { path = "../../crates/leptos", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures = "=0.3.34"
serde_json = "=1.0.154"

[[example]]
name = "document"
required-features = ["ssr"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
