[package]
name = "stackpress-example-profile-ui-shared"
description = "One Profile component for SSR, hydration and packaged CSR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
ssr = ["stackpress-framework-view/leptos-ssr", "stackpress-leptos/ssr"]
hydrate = ["stackpress-framework-view/leptos-hydrate", "stackpress-leptos/hydrate"]
csr = ["stackpress-framework-view/leptos-csr", "stackpress-leptos/csr"]

[dependencies]
stackpress-framework-view = { path = "../../../crates/framework/framework-view", features = ["leptos"] }
leptos = { version = "=0.8.22", default-features = false }
stackpress-leptos = { path = "../../../crates/leptos" }
stackpress-example-profile-ui-contracts = { path = "../contracts" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element"] }

[lints]
workspace = true
