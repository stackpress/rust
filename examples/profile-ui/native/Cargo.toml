[package]
name = "stackpress-example-profile-ui-native"
description = "Permitted local Profile search with finite cancellation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
app = ["dep:tauri", "dep:tauri-build"]
demo-customization = []
# Manual installed review fixtures; never admitted by a release build.
review-preview = []

[[bin]]
name = "profile-ui"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
stackpress-lib = { path = "../../../crates/lib" }
stackpress-server = { path = "../../../crates/server" }
stackpress-example-generated-profile = { path = "../../generated-profile/app" }
stackpress-example-profile-ui-contracts = { path = "../contracts" }
serde_json = "1"
stackpress-framework-language = { path = "../../../crates/framework/framework-language" }
stackpress-framework-preferences = { path = "../../../crates/framework/framework-preferences", features = ["native-file"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tauri = { version = "=2.12.5", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true , features = [] }

[lints]
workspace = true
