[package]
name = "stackpress-example-profile-ui-web"
description = "Send page loader over the existing generated Profile capability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
demo-customization = []
sqlite = ["dep:stackpress-example-sql-profile"]

[dependencies]
leptos = { version = "=0.8.22", default-features = false }
stackpress-lib = { path = "../../../crates/lib" }
stackpress-server = { path = "../../../crates/server/server", features = ["http"] }
stackpress-framework-view = { path = "../../../crates/framework/framework-view", features = ["leptos-ssr", "server"] }
stackpress-leptos = { path = "../../../crates/leptos", features = ["ssr"] }
stackpress-example-generated-profile = { path = "../../generated-profile/app" }
stackpress-example-sql-profile = { path = "../../sql-profile", optional = true }
stackpress-example-profile-ui-contracts = { path = "../contracts" }
stackpress-example-profile-ui-shared = { path = "../shared", features = ["ssr"] }
serde_json = "1"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
stackpress-cli = { path = "../../../tools/cli" }
tempfile = "3"

[lints]
workspace = true
