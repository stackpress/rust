[package]
name = "data-quickstart"
description = "Idea-to-SQLite getting-started example with explicit schema history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:stackpress-framework-sql", "dep:stackpress-sql", "dep:stackpress-sql-sqlite", "dep:stackpress-lib", "dep:stackpress-server", "dep:tokio"]
evolved = []
expanded = ["evolved"]

[dependencies]
stackpress-framework-schema = { path = "../../crates/framework/framework-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackpress-framework-sql = { path = "../../crates/framework/framework-sql", features = ["server"], optional = true }
stackpress-sql = { path = "../../crates/sql/sql", optional = true }
stackpress-sql-sqlite = { path = "../../crates/sql/sql-sqlite", optional = true }
stackpress-lib = { path = "../../crates/lib", optional = true }
stackpress-server = { path = "../../crates/server", optional = true }
tokio = { version = "1", features = ["macros", "rt"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "data-quickstart"
path = "src/main.rs"
required-features = ["native"]

[lints]
workspace = true
