[package]
name = "api-checkpoint-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = []
hydrate = ["stackpress-framework-api/ui-hydrate"]
csr = ["stackpress-framework-api/ui-csr"]
[dependencies]
stackpress-leptos = { path = "../../../crates/leptos", features = ["format"] }
stackpress-framework-api = { path = "../../../crates/framework/framework-api", features = ["ui"] }
stackpress-framework-admin = { path = "../../../crates/framework/framework-admin", features = ["format"] }
stackpress-framework-schema = { path = "../../../crates/framework/framework-schema" }
leptos = { version = "=0.8.22", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlFormElement", "Node", "Response", "AbortController", "AbortSignal", "RequestInit", "Location"] }
