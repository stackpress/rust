[package]
name = "stackpress-example-sql-profile"
description = "Explicitly installed SQLite profiles application with direct, CLI and buffered HTTP parity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "sql-profile"
path = "src/main.rs"
doc = false

[[bin]]
name = "sql-profile-setup"
path = "src/bin/setup.rs"
doc = false

[dependencies]
stackpress-lib = { path = "../../crates/lib" }
stackpress-server = { path = "../../crates/server/server", default-features = false, features = ["http"] }
stackpress-cli = { path = "../../tools/cli", default-features = false }
stackpress-sql = { path = "../../crates/sql/sql" }
stackpress-sql-sqlite = { path = "../../crates/sql/sql-sqlite" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
stackpress-example-capability-host = { path = "../capability-host" }

[lints]
workspace = true
