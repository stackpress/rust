[package]
name = "stackpress-example-review-preview"
description = "Debug-only Slice 8 owner review host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
review-preview = [
    "dep:stackpress-lib",
    "dep:stackpress-server",
    "dep:stackpress-server-http",
    "dep:stackpress-framework-view",
    "dep:stackpress-framework-ui",
    "dep:stackpress-framework-preferences",
    "dep:stackpress-sql",
    "dep:stackpress-example-ui-gallery-web",
    "dep:stackpress-example-ui-preferences-web",
    "dep:stackpress-example-ui-stream-web",
    "dep:stackpress-example-ui-format",
    "dep:generated-admin-web",
    "dep:generated-admin-shared",
    "dep:leptos",
    "dep:tokio",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:base64",
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "generated-admin-web/review-preview",
]
[[bin]]
name = "slice8-review"
path = "src/main.rs"
required-features = ["review-preview"]

[dependencies]
stackpress-lib = { path = "../../crates/lib", optional = true }
stackpress-server = { path = "../../crates/server/server", features = ["http-stream"], optional = true }
stackpress-server-http = { path = "../../crates/server/http", optional = true }
stackpress-framework-view = { path = "../../crates/framework/framework-view", optional = true }
stackpress-framework-ui = { path = "../../crates/framework/framework-ui", features = ["ssr", "rich", "format", "stream"], optional = true }
stackpress-framework-preferences = { path = "../../crates/framework/framework-preferences", optional = true }
stackpress-sql = { path = "../../crates/sql/sql", optional = true }
stackpress-example-ui-gallery-web = { path = "../ui-gallery/web", optional = true }
stackpress-example-ui-preferences-web = { path = "../ui-preferences/web", optional = true }
stackpress-example-ui-stream-web = { path = "../ui-stream/web", optional = true }
stackpress-example-ui-format = { path = "../ui-format", features = ["ssr", "rich", "format"], optional = true }
generated-admin-web = { path = "../generated-admin/web", optional = true }
generated-admin-shared = { path = "../generated-admin/shared", features = ["ssr"], optional = true }
leptos = { version = "=0.8.22", default-features = false, features = ["ssr"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

tempfile = { version = "3", optional = true }

[lints]
workspace = true
