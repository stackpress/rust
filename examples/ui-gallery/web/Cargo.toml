[package]
name = "stackpress-example-ui-gallery-web"
description = "Slice 8 bounded shared UI proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "=0.8.22", default-features = false }
stackpress-example-ui-gallery-shared = { path = "../shared", features = ["ssr"] }
stackpress-leptos = { path = "../../../crates/leptos", features = ["ssr", "rich"] }
stackpress-framework-view = { path = "../../../crates/framework/framework-view", features = ["leptos-ssr", "preferences"] }
stackpress-framework-language = { path = "../../../crates/framework/framework-language" }
stackpress-lib = { path = "../../../crates/lib" }
stackpress-server = { path = "../../../crates/server/server", features = ["http"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
