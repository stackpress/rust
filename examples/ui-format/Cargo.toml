[package]
name = "stackpress-example-ui-format"
description = "Finite shared rich-content and deterministic formatting proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ui-format"
path = "src/main.rs"
required-features = ["ssr", "rich", "format"]

[features]
default = []
ssr = ["stackpress-leptos/ssr"]
hydrate = ["stackpress-leptos/hydrate"]
csr = ["stackpress-leptos/csr"]
rich = ["stackpress-leptos/rich"]
format = ["stackpress-leptos/format"]

[dependencies]
leptos = { version = "=0.8.22", default-features = false }
stackpress-leptos = { path = "../../crates/leptos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlInputElement"] }

[lints]
workspace = true
