[package]
name = "stackpress-example-ui-stream-web"
description = "Real Hyper duplex streamed SSR proof without listeners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
stackpress-example-ui-stream-shared = { path = "../shared", features = ["ssr"] }
stackpress-leptos = { path = "../../../crates/leptos", features = ["stream"] }
stackpress-framework-view = { path = "../../../crates/framework/framework-view" , features = ["leptos-stream"] }
stackpress-lib = { path = "../../../crates/lib" }
stackpress-server = { path = "../../../crates/server/server", features = ["http-stream"] }
stackpress-server-http = { path = "../../../crates/server/http" }
leptos = { version = "=0.8.22", default-features = false }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }

[lints]
workspace = true
