[package]
name = "stackpress-example-ui-stream-shared"
description = "Shared in-order SSR demonstration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
ssr = ["stackpress-leptos/stream", "dep:tokio"]
hydrate = ["stackpress-leptos/hydrate"]

[dependencies]
stackpress-leptos = { path = "../../../crates/leptos", features = ["async"] }
leptos = { version = "=0.8.22", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Response"] }

[lints]
workspace = true
