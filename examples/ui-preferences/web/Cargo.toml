[package]
name = "stackpress-example-ui-preferences-web"
description = "Finite Slice 8 preferences proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "=0.8.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackpress-framework-language = { path = "../../../crates/framework/framework-language" }
stackpress-framework-preferences = { path = "../../../crates/framework/framework-preferences" }
stackpress-framework-view = { path = "../../../crates/framework/framework-view" }
stackpress-framework-ui = { path = "../../../crates/framework/framework-ui", features = ["ssr"] }
stackpress-example-ui-preferences-shared = { path = "../shared", features = ["ssr"] }
stackpress-lib = { path = "../../../crates/lib" }
stackpress-server = { path = "../../../crates/server", features = ["http"] }
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
