[workspace]
members = ["crates/lib", "crates/server", "tools/cli", "examples/capability-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[package]
name = "stackpress"
description = "Explicit facade for the Stackpress Rust libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
stackpress-lib = { path = "crates/lib" }
stackpress-server = { path = "crates/server", optional = true, default-features = false }

[features]
default = []
server = ["dep:stackpress-server"]
server-http = ["server", "stackpress-server/http"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
