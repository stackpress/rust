[workspace]
members = [
    "crates/lib", "crates/server/server", "crates/server/http", "tools/cli", "examples/capability-host",
    "crates/idea/idea-parser", "crates/idea/idea-transformer", "crates/idea/idea",
    "examples/generated-profile/codegen", "examples/generated-profile/app",
    "crates/sql/sql", "crates/sql/sql-sqlite", "examples/sql-profile",
    "crates/sql/sql-postgres", "crates/sql/sql-mysql",
    "crates/framework/framework-view", "crates/framework/framework-ui", "crates/framework/framework-language",
    "examples/profile-ui/contracts", "examples/profile-ui/shared",
    "examples/profile-ui/web", "examples/profile-ui/client", "examples/profile-ui/native",
    "examples/profile-ui/gateway",
    "examples/review-preview",
    "examples/ui-stream/shared", "examples/ui-stream/client", "examples/ui-stream/web",
    "examples/ui-gallery/shared", "examples/ui-gallery/client", "examples/ui-gallery/web",
    "crates/framework/framework-preferences",
    "examples/ui-preferences/shared", "examples/ui-preferences/client", "examples/ui-preferences/web",
    "crates/framework/framework-schema", "crates/framework/framework-sql",
    "examples/generated-workspace/tool", "examples/generated-workspace/app",
    "examples/generated-workspace/contracts",
    "examples/data-quickstart",
    "examples/ui-format",
    "crates/framework/framework-admin",
    "examples/generated-admin/tool", "examples/generated-admin/shared",
    "examples/generated-admin/client", "examples/generated-admin/web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[package]
name = "stackpress"
description = "Explicit facade for the Stackpress Rust libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
stackpress-lib = { path = "crates/lib" }
stackpress-server = { path = "crates/server/server", optional = true, default-features = false }
stackpress-server-http = { path = "crates/server/http", optional = true }
stackpress-idea-parser = { path = "crates/idea/idea-parser", optional = true }
stackpress-idea-transformer = { path = "crates/idea/idea-transformer", optional = true }
stackpress-idea = { path = "crates/idea/idea", optional = true }
stackpress-sql = { path = "crates/sql/sql", optional = true }
stackpress-sql-sqlite = { path = "crates/sql/sql-sqlite", optional = true }
stackpress-sql-postgres = { path = "crates/sql/sql-postgres", optional = true }
stackpress-sql-mysql = { path = "crates/sql/sql-mysql", optional = true }
stackpress-framework-view = { path = "crates/framework/framework-view", optional = true }
stackpress-framework-ui = { path = "crates/framework/framework-ui", optional = true }
stackpress-framework-language = { path = "crates/framework/framework-language", optional = true }
stackpress-framework-preferences = { path = "crates/framework/framework-preferences", optional = true }

stackpress-framework-schema = { path = "crates/framework/framework-schema", optional = true }
stackpress-framework-sql = { path = "crates/framework/framework-sql", optional = true }
stackpress-framework-admin = { path = "crates/framework/framework-admin", optional = true }

[features]
default = []
framework-schema = ["dep:stackpress-framework-schema"]
framework-sql = ["dep:stackpress-framework-sql"]
framework-admin = ["dep:stackpress-framework-admin"]
framework-admin-format = ["framework-admin", "stackpress-framework-admin/format"]
server = ["dep:stackpress-server"]
server-http = ["server", "stackpress-server/http"]
server-http-host = ["server-http", "dep:stackpress-server-http"]
server-http-host-tls = ["server-http-host", "stackpress-server-http/tls"]
idea-parser = ["dep:stackpress-idea-parser"]
idea-transformer = ["dep:stackpress-idea-transformer"]
idea = ["dep:stackpress-idea"]
sql = ["dep:stackpress-sql"]
sql-sqlite = ["sql", "dep:stackpress-sql-sqlite"]
sql-postgres = ["sql", "dep:stackpress-sql-postgres"]
sql-mysql = ["sql", "dep:stackpress-sql-mysql"]
framework-view = ["dep:stackpress-framework-view"]
framework-view-server = ["framework-view", "stackpress-framework-view/server"]
framework-ui = ["framework-view", "dep:stackpress-framework-ui"]
framework-ui-ssr = ["framework-ui", "stackpress-framework-ui/ssr"]
framework-ui-hydrate = ["framework-ui", "stackpress-framework-ui/hydrate"]
framework-ui-csr = ["framework-ui", "stackpress-framework-ui/csr"]
framework-ui-async = ["framework-ui", "stackpress-framework-ui/async"]
framework-ui-rich = ["framework-ui", "stackpress-framework-ui/rich"]
framework-ui-format = ["framework-ui", "stackpress-framework-ui/format"]
framework-language = ["dep:stackpress-framework-language"]
framework-preferences = ["dep:stackpress-framework-preferences"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
